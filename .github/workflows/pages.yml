name: UI Storybook Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI
        uses: actions/checkout@v6
        with:
          path: ui

      - name: Check out Engine dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/engine
          ref: 78c201fbda882356b93b08c4acdfabb8d33ad563
          path: engine

      - name: Check out Layout dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/layout
          ref: 4473651ad801c88d982593e7336d5b3b7365459c
          path: layout

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Register Engine package
        working-directory: engine/packages/core
        run: bun link

      - name: Install Layout dependencies
        working-directory: layout
        run: bun install --frozen-lockfile

      - name: Register Layout package
        working-directory: layout/packages/core
        run: bun link

      - name: Install locked dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Verify and build static Storybook
        working-directory: ui
        run: bun run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
