name: UI Storybook Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI
        uses: actions/checkout@v6
        with:
          path: ui

      - name: Check out Engine dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/engine
          ref: e02516423a529749119eaf5438f68a944491577e
          path: engine

      - name: Check out Layout dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/layout
          ref: 1856377275c4f601d784f85ca499c28e678942da
          path: layout

      - name: Check out Highlighter dependency
        uses: actions/checkout@v6
        with:
          repository: zavx0z/highlighter
          ref: a9f240b682a6ccec042ea04522220f153d3b53eb
          path: highlighter

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Register Engine package
        working-directory: engine/packages/core
        run: bun link

      - name: Install Layout dependencies
        working-directory: layout
        run: bun install --frozen-lockfile

      - name: Register Layout package
        working-directory: layout/packages/core
        run: bun link

      - name: Install and verify Highlighter dependency
        working-directory: highlighter
        run: bun install --frozen-lockfile && bun run check

      - name: Register Highlighter package
        working-directory: highlighter
        run: bun link

      - name: Install locked dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Verify and build static Storybook
        working-directory: ui
        run: bun run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
